<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Contato | DevAcademy</title>
</head>

<body>

    <header class="cabecalho-principal">

        <a href="index.html" class="logo">
            Dev<span>Academy</span>
        </a>

        <nav>
            <ul class="menu-flex">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

    </header>

    <main class="pagina-contato">

        <section class="contato-section">

            <h1>Fale Conosco</h1>

            <p class="contato-introducao">
                Tem alguma dúvida sobre nossos cursos?
                Entre em contato com a DevAcademy.
            </p>

            <form action="#" method="post" id="form-contato">

                <div class="campo-formulario">
                    <label for="nome">Nome Completo</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Seu nome aqui..."
                        required>
                </div>

                <div class="campo-formulario">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@email.com"
                        required>
                </div>

                <div class="campo-formulario">
                    <label for="interesse">Área de Interesse</label>

                    <select id="interesse" name="interesse">

                        <option value="frontend">
                            Desenvolvimento Front-end
                        </option>

                        <option value="backend">
                            Desenvolvimento Back-end
                        </option>

                        <option value="uiux">
                            UI/UX Design
                        </option>

                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="mensagem">Mensagem</label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="6"
                        placeholder="Digite sua mensagem..."></textarea>
                </div>

                <div class="botoes-formulario">

                    <input
                        type="submit"
                        value="Enviar Mensagem"
                        class="botao-enviar">

                    <input
                        type="reset"
                        value="Limpar"
                        class="botao-limpar">

                </div>

            </form>

        </section>

    </main>

    <footer class="rodape-moderno">

        <div class="contato-footer">
            <p>Rua da Tecnologia, 1024 - Paraná</p>
            <p>contato@devacademy.com</p>
        </div>

        <p class="copyright">
            &copy; 2026 DevAcademy - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
