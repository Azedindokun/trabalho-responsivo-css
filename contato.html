<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Contato | DevAcademy</title>
</head>
<body>
    <header class="cabecalho-principal">
        <a href="index.html" class="logo">Dev<span>Academy</span></a>
        <nav>
            <ul class="menu-flex">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 5rem 10%;">
        <h2 style="text-align: center;">Fale Conosco</h2>
        <form action="#" method="post" id="form-contato">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome aqui..." required>

            <label for="email">E-mail Corporativo</label>
            <input type="email" id="email" name="email" required>

            <label for="interesse">Área de Interesse</label>
            <select id="interesse" name="interesse">
                <option value="frontend">Desenvolvimento Front-end</option>
                <option value="backend">Desenvolvimento Back-end</option>
                <option value="uiux">UI/UX Design</option>
            </select>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5"></textarea>

            <div style="display: flex; gap: 1rem;">
                <input type="submit" value="Enviar Mensagem" style="background: var(--accent); color: #000; font-weight: bold; cursor: pointer; flex: 2;">
                <input type="reset" value="Limpar" style="cursor: pointer; flex: 1;">
            </div>
        </form>
    </main>

    <footer class="footer-final">
        <p>&copy; 2026 DevAcademy.</p>
    </footer>
</body>
</html>
