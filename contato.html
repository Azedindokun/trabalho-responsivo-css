<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Contato | DevAcademy</title>
</head>
<body>
    <header>
        <div class="logo-box">
            <h1>DevAcademy</h1>
            <p id="slogan">Transformando o futuro através do código</p>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 4rem 5%;">
        <h2 style="text-align: center;">Fale Conosco</h2>
        <form action="#" method="POST" id="form-contato">
            <div class="campo-formulario">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo-formulario">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo-formulario">
                <label for="interesse">Interesse:</label>
                <select id="interesse" name="interesse">
                    <option value="frontend">Desenvolvimento Front-end</option>
                    <option value="backend">Desenvolvimento Back-end</option>
                </select>
            </div>

            <div class="campo-formulario">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5"></textarea>
            </div>

            <input type="submit" value="Enviar Mensagem" class="btn-enviar">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 DevAcademy.</p>
    </footer>
</body>
</html>
