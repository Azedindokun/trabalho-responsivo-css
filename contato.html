<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Contato - DevAcademy</title>
</head>
<body>
    <header>
        <h1>DevAcademy</h1>
        <p id="slogan">Transformando o futuro através do código</p>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="secao-contato">
            <h2>Fale Conosco</h2>
            <form action="#" method="post" id="form-contato">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="interesse">Interesse:</label>
                <select id="interesse" name="interesse">
                    <option value="frontend">Front-end</option>
                    <option value="backend">Back-end</option>
                    <option value="fullstack">Full Stack</option>
                </select>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5"></textarea>

                <div class="botoes">
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Rua da Tecnologia, 1024, Capanema - PR</p>
        <p>Telefone: (46) 9999-8888 | E-mail: contato@devacademy.com</p>
        <p>&copy; 2026 DevAcademy - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
